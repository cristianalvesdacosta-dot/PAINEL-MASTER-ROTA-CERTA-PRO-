<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Master - Rota Certa</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #1e1e2f; color: #fff; padding: 20px; margin: 0; }
        .container { max-width: 650px; margin: 0 auto; background: #2d2d44; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #f1c40f; margin-top: 0; }
        p { text-align: center; color: #aaa; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #444; font-size: 14px; }
        th { color: #3498db; }
        .btn { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .btn-ativo { background: #2ecc71; color: #fff; }
        .btn-bloqueado { background: #e74c3c; color: #fff; }
        .btn-excluir { background: #7f8c8d; color: #fff; margin-left: 5px; }
        .btn-excluir:hover { background: #c0392b; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🛠️ Painel Master - Gestão de Assinaturas</h2>
        <p>Controle de acesso e remoção de clientes do Rota Certa</p>
        
        <table>
            <thead>
                <tr>
                    <th>Cliente / Moto</th>
                    <th>Licença</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="lista-clientes">
                <tr><td colspan="3" style="text-align: center;">Carregando clientes...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://rotacertagps-9ff13-default-rtdb.firebaseio.com"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        const listaClientesHTML = document.getElementById('lista-clientes');

        db.ref('entregadores').on('value', (snapshot) => {
            listaClientesHTML.innerHTML = '';
            
            if (!snapshot.exists()) {
                listaClientesHTML.innerHTML = "<tr><td colspan='3' style='text-align: center;'>Nenhum cliente cadastrado ainda.</td></tr>";
                return;
            }

            snapshot.forEach((childSnapshot) => {
                const nomeCliente = childSnapshot.key;
                const dados = childSnapshot.val();
                const licencaAtual = dados.licenca || 'ativo';

                let tr = document.createElement('tr');
                
                let statusBadge = licencaAtual === 'ativo' 
                    ? '<span style="color: #2ecc71; font-weight: bold;">🟢 ATIVO</span>' 
                    : '<span style="color: #e74c3c; font-weight: bold;">🔴 BLOQUEADO</span>';

                let botaoStatus = licencaAtual === 'ativo'
                    ? `<button class="btn btn-bloqueado" onclick="mudarLicenca('${nomeCliente}', 'bloqueado')">Bloquear</button>`
                    : `<button class="btn btn-ativo" onclick="mudarLicenca('${nomeCliente}', 'ativo')">Renovar / Liberar</button>`;

                let botaoExcluir = `<button class="btn btn-excluir" onclick="excluirCliente('${nomeCliente}')">🗑️ Excluir</button>`;

                tr.innerHTML = `
                    <td><b>${nomeCliente}</b></td>
                    <td>${statusBadge}</td>
                    <td>${botaoStatus} ${botaoExcluir}</td>
                `;
                listaClientesHTML.appendChild(tr);
            });
        });

        function mudarLicenca(cliente, novaLicenca) {
            db.ref('entregadores/' + cliente).update({
                licenca: novaLicenca
            }).then(() => {
                console.log(`Licença de ${cliente} alterada para ${novaLicenca}`);
            });
        }

        function excluirCliente(cliente) {
            if (confirm(`Tem certeza que deseja excluir permanentemente o cliente "${cliente}"? Todos os dados dele serão apagados.`)) {
                db.ref('entregadores/' + cliente).remove()
                    .then(() => {
                        alert(`🗑️ Cliente ${cliente} excluído com sucesso!`);
                    })
                    .catch((error) => {
                        alert('Erro ao excluir: ' + error.message);
                    });
            }
        }
    </script>
</body>
</html>
