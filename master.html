<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Master - Rota Certa</title>
    <!-- Firebase SDK (Versão 8 compatível) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #1e1e2f; color: #fff; padding: 20px; margin: 0; }
        .container { max-width: 900px; margin: 0 auto; background: #2d2d44; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #f1c40f; margin-top: 0; }
        p { text-align: center; color: #aaa; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #444; font-size: 13px; vertical-align: middle; }
        th { color: #3498db; }
        .btn { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; margin: 2px 0; }
        .btn-ativo { background: #2ecc71; color: #fff; }
        .btn-bloqueado { background: #e74c3c; color: #fff; }
        .btn-excluir { background: #7f8c8d; color: #fff; }
        .btn-excluir:hover { background: #c0392b; }
        .btn-whats { background: #25d366; color: #fff; text-decoration: none; display: inline-block; padding: 6px 10px; border-radius: 6px; font-weight: bold; text-align: center; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🛠️ Painel Master - Gestão de Entregadores</h2>
        <p>Monitoramento em tempo real de status, licenças e localizações</p>
        
        <table>
            <thead>
                <tr>
                    <th>Entregador / Usuário</th>
                    <th>Status / Licença</th>
                    <th>Ações e Rastreio</th>
                </tr>
            </thead>
            <tbody id="lista-clientes">
                <tr><td colspan="3" style="text-align: center;">Carregando entregadores...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://rotacertagps-9ff13-default-rtdb.firebaseio.com"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        const listaClientesHTML = document.getElementById('lista-clientes');

        // Ouve em tempo real a raiz correta 'entregadores' usada no seu projeto
        db.ref('entregadores').on('value', (snapshot) => {
            listaClientesHTML.innerHTML = '';
            
            console.log("Dados do Firebase:", snapshot.val());

            if (!snapshot.exists()) {
                listaClientesHTML.innerHTML = "<tr><td colspan='3' style='text-align: center;'>Nenhum entregador cadastrado ainda.</td></tr>";
                return;
            }

            snapshot.forEach((childSnapshot) => {
                const usuarioKey = childSnapshot.key;
                const dados = childSnapshot.val() || {};
                const nomeEntregador = dados.nome || usuarioKey;
                const licencaAtual = dados.licenca || 'ativo';
                const statusAtual = dados.status || 'offline';
                const lat = dados.lat;
                const lon = dados.lon;

                let tr = document.createElement('tr');
                
                let statusBadge = statusAtual === 'online'
                    ? `<span style="color: #2ecc71; font-weight: bold;">🟢 Online</span>` 
                    : `<span style="color: #e74c3c; font-weight: bold;">🔴 Offline</span>`;

                let licencaBadge = licencaAtual === 'ativo'
                    ? `<span style="color: #3498db; margin-left: 8px;">Licença: Ativa</span>`
                    : `<span style="color: #e74c3c; margin-left: 8px;">Licença: Bloqueada</span>`;

                let infoLocal = (lat && lon) 
                    ? `<br><span style="font-size: 11px; color: #aaa;">Lat: ${lat.toFixed(4)}, Lon: ${lon.toFixed(4)}</span>`
                    : `<br><span style="font-size: 11px; color: #e74c3c;">Sem sinal de GPS recente</span>`;

                let botaoWhats = (lat && lon)
                    ? `<a href="https://api.whatsapp.com/send?text=${encodeURIComponent(`📍 Localização de ${nomeEntregador}:\nhttps://www.google.com/maps?q=${lat},${lon}`)}" target="_blank" class="btn-whats">📱 Enviar Local</a>`
                    : `<span style="font-size: 11px; color: #777;">Sem GPS disponível</span>`;

                let botaoStatus = licencaAtual === 'ativo'
                    ? `<button class="btn btn-bloqueado" onclick="mudarLicenca('${usuarioKey}', 'bloqueado')">Bloquear</button>`
                    : `<button class="btn btn-ativo" onclick="mudarLicenca('${usuarioKey}', 'ativo')">Liberar</button>`;

                let botaoExcluir = `<button class="btn btn-excluir" onclick="excluirEntregador('${usuarioKey}')">🗑️ Excluir</button>`;

                tr.innerHTML = `
                    <td><b>${nomeEntregador}</b> <br><small style="color:#aaa;">ID: ${usuarioKey}</small></td>
                    <td>${statusBadge} ${licencaBadge} ${infoLocal}</td>
                    <td>
                        ${botaoWhats}<br>
                        ${botaoStatus} 
                        ${botaoExcluir}
                    </td>
                `;
                listaClientesHTML.appendChild(tr);
            });
        });

        function mudarLicenca(usuario, novaLicenca) {
            db.ref('entregadores/' + usuario).update({
                licenca: novaLicenca
            }).then(() => {
                console.log(`Licença de ${usuario} alterada para ${novaLicenca}`);
            });
        }

        function excluirEntregador(usuario) {
            if (confirm(`Tem certeza que deseja excluir permanentemente o entregador "${usuario}"?`)) {
                db.ref('entregadores/' + usuario).remove()
                    .then(() => {
                        alert(`🗑️ Entregador ${usuario} excluído com sucesso!`);
                    })
                    .catch((error) => {
                        alert('Erro ao excluir: ' + error.message);
                    });
            }
        }
    </script>
</body>
</html>
